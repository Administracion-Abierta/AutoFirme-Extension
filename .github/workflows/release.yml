name: Release

# Runs on the GitHub release that Release Please publishes, never on a plain tag: the
# release PR is what keeps both version files and CHANGELOG.md in step.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  artifacts:
    name: build and attach release artifacts
    runs-on: ubuntu-latest
    # node:24-trixie: curl + python3 for the release API upload below; the
    # default label image is uncontrolled and has no curl CA bundle guarantee.
    container: node:24-trixie
    timeout-minutes: 25
    steps:
      - name: Install toolchain
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # container runs as root; the checked-out tree is owned by the runner
      # uid, so git refuses it without this (package-extension.py rev-parses HEAD).
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      # A release that bumps only one of the two version files must not ship.
      - run: node scripts/check-versions.mjs ${{ github.event.release.tag_name }}
      - run: pnpm build:extension
      - run: pnpm package:extension
      # Issue #3: build the package twice from scratch; a change that breaks the
      # reproducibility of package-extension.py must fail here, before upload.
      - name: Verify packaging reproducibility (build twice, compare SHA256SUMS)
        run: |
          cp dist/SHA256SUMS sums-a.txt
          rm -rf dist .svelte-kit
          pnpm build:extension
          pnpm package:extension
          diff sums-a.txt dist/SHA256SUMS
      - name: Attach artifacts to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release.sh "${{ github.event.release.tag_name }}" dist/autofirme-extension-*.zip dist/SHA256SUMS
      # upload-artifact v4 fails on non-GitHub hosts (GHESNotSupportedError);
      # the Forgejo release-published event reaches this workflow, so skip there.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.server_url, 'https://github.com')
        with:
          name: release-artifacts
          path: |
            dist/autofirme-extension-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
